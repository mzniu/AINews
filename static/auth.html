<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AINews · 登录</title>
    <link rel="icon" type="image/png" href="brand/ainews-mark.png?v=20260914">
    <link rel="stylesheet" href="/static/css/design-system/fonts.css">
    <link rel="stylesheet" href="/static/css/design-system/tokens.css">
    <script src="/js/shared/theme.js?v=20260917"></script>
    <style>
        :root {
            color-scheme: light;
            --bg: #f0f3fa;
            --card: #ffffff;
            --border: rgba(18, 52, 153, 0.14);
            --text: #0b1538;
            --muted: #6b7aa6;
            --accent: #123499;
            --accent-hover: #1a45b8;
            --danger: #c62828;
            --ok: #0d9f6e;
            --btn-secondary-bg: #cdd8fe;
            --btn-secondary-text: #00072d;
            --btn-secondary-border: rgba(0, 7, 45, 0.22);
            --btn-secondary-hover-bg: #b4c4fc;
        }
        [data-theme="dark"] {
            color-scheme: dark;
            --bg: #00072d;
            --card: rgba(5, 22, 80, 0.92);
            --border: rgba(18, 52, 153, 0.42);
            --text: #e8eaf6;
            --muted: #a8b4d4;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-ui, "Roboto", "Segoe UI", system-ui, sans-serif);
            background: linear-gradient(165deg, #f4f6fc 0%, #e8edf8 38%, #dde5f5 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        [data-theme="dark"] body {
            background: radial-gradient(ellipse 130% 90% at 50% -10%, #0a2472 0%, #051650 45%, #00072d 100%);
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 24px 48px rgba(0,0,0,.35);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .brand img { width: 32px; height: 32px; }
        .brand h1 { margin: 0; font-size: 1.35rem; font-weight: 600; }
        .subtitle { color: var(--muted); font-size: .9rem; margin: 0 0 24px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab {
            flex: 1;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: .9rem;
        }
        .tab.is-active {
            background: rgba(18, 52, 153, 0.1);
            border-color: var(--accent);
            color: var(--text);
        }
        label { display: block; font-size: .85rem; font-weight: 600; color: #3d4f7a; margin-bottom: 6px; }
        [data-theme="dark"] label { color: #c5d0e6; }
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--color-surface-inset, #eef2fa);
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 14px;
        }
        input:focus { outline: 2px solid rgba(18, 52, 153, 0.28); border-color: var(--accent); }
        .row { display: flex; gap: 8px; align-items: flex-start; }
        .row input { flex: 1; margin-bottom: 0; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: .95rem;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-primary {
            width: 100%;
            background: var(--accent);
            color: #fff;
            margin-top: 8px;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            border: 1px solid var(--btn-secondary-border);
            white-space: nowrap;
            min-width: 108px;
        }
        .btn-secondary:hover:not(:disabled) {
            background: var(--btn-secondary-hover-bg);
            color: var(--btn-secondary-text);
        }
        .btn-secondary:disabled { opacity: .55; cursor: not-allowed; }
        .msg {
            min-height: 1.25rem;
            font-size: .85rem;
            margin: 10px 0 0;
            color: var(--muted);
        }
        .msg.error { color: var(--danger); }
        .msg.ok { color: var(--ok); }
        .panel[hidden] { display: none !important; }
        .offline-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .offline-section h2 { font-size: .95rem; margin: 0 0 10px; font-weight: 500; }
        .captcha-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,.55);
            display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .captcha-modal[hidden] { display: none !important; }
        .captcha-box {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; width: min(360px, 92vw);
        }
        .captcha-svg { margin: 12px 0; background: #fff; border-radius: 6px; padding: 8px; }
        .mode-switch {
            margin-top: 14px;
            text-align: center;
            font-size: .85rem;
            color: var(--muted);
        }
        .mode-switch button {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: inherit;
            padding: 0;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .mode-switch button:hover { color: var(--accent-hover); }
        .register-only[hidden] { display: none !important; }
        .login-only[hidden] { display: none !important; }

        .startup-loading {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(ellipse at top, #1e293b 0%, var(--bg) 55%);
        }
        .startup-loading[hidden] { display: none !important; }
        .startup-loading-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 320px;
        }
        .ripple-logo-wrap {
            position: relative;
            width: 128px;
            height: 128px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .ripple-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(59, 130, 246, 0.42);
            animation: startup-ripple 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }
        .ripple-ring:nth-child(2) { animation-delay: 0.8s; }
        .ripple-ring:nth-child(3) { animation-delay: 1.6s; }
        @keyframes startup-ripple {
            0% {
                transform: scale(0.5);
                opacity: 0.75;
            }
            100% {
                transform: scale(1.45);
                opacity: 0;
            }
        }
        .startup-logo {
            width: 56px;
            height: 56px;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 6px 18px rgba(59, 130, 246, 0.28));
        }
        .startup-title {
            margin: 0 0 8px;
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .startup-status {
            margin: 0;
            color: var(--text);
            font-size: 0.95rem;
            min-height: 1.4rem;
        }
        .startup-hint {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 0.82rem;
        }
        .startup-progress {
            width: 100%;
            max-width: 280px;
            margin: 16px 0 0;
            height: 6px;
            border-radius: 999px;
            background: rgba(18, 52, 153, 0.12);
            overflow: hidden;
        }
        .startup-progress[hidden] { display: none !important; }
        .startup-progress-bar {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent), #3b82f6);
            transition: width 0.35s ease;
        }
        .startup-step-label {
            margin: 8px 0 0;
            font-size: 0.8rem;
            color: var(--muted);
            min-height: 1.2rem;
            max-width: 320px;
        }
        .startup-loading-inner.is-error .ripple-logo-wrap,
        .startup-loading-inner.is-error .startup-status,
        .startup-loading-inner.is-error .startup-hint {
            display: none;
        }
        .startup-error {
            text-align: left;
            max-width: 420px;
            margin: 0 auto;
        }
        .startup-error[hidden] { display: none !important; }
        .startup-error-title {
            margin: 0 0 8px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
        }
        .startup-error-summary {
            margin: 0 0 12px;
            font-size: 0.9rem;
            line-height: 1.55;
            color: var(--text);
        }
        .startup-error-detail {
            margin: 0 0 14px;
            padding: 12px 14px;
            max-height: 200px;
            overflow: auto;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 0.72rem;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
            background: rgba(11, 21, 56, 0.06);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #1e293b;
        }
        [data-theme="dark"] .startup-error-detail {
            background: rgba(0, 0, 0, 0.25);
            color: #e2e8f0;
        }
        .startup-error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .startup-error-actions .btn {
            margin-top: 0;
            flex: 1 1 auto;
            min-width: 120px;
        }
        @media (prefers-reduced-motion: reduce) {
            .ripple-ring {
                animation: none;
                opacity: 0.35;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="card" id="auth-card">
        <div class="brand">
            <img src="brand/ainews-mark.png?v=20260914" alt="" width="32" height="32">
            <h1>AINews</h1>
        </div>
        <p class="subtitle">登录后即可使用资讯抓取、视频制作与多平台发布</p>

        <div id="auth-forms" hidden>
            <div class="tabs" role="tablist">
                <button type="button" class="tab is-active" data-tab="phone-login">手机登录</button>
                <button type="button" class="tab" data-tab="email-login">邮箱登录</button>
            </div>

            <div id="panel-phone-login" class="panel">
                <label for="phone">手机号</label>
                <input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="11 位手机号" autocomplete="tel">

                <label for="phone-code">验证码</label>
                <div class="row">
                    <input id="phone-code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
                    <button type="button" class="btn btn-secondary" id="btn-send-code">发送验证码</button>
                </div>

                <button type="button" class="btn btn-primary" id="btn-phone-submit">登录</button>
                <p class="msg" id="phone-msg"></p>
                <p class="mode-switch">
                    <span id="phone-mode-hint">没有账号？</span>
                    <button type="button" id="phone-mode-toggle">注册</button>
                </p>
            </div>

            <div id="panel-email-login" class="panel" hidden>
                <label for="email">邮箱</label>
                <input id="email" type="email" placeholder="user@example.com" autocomplete="email" list="remembered-emails">

                <label for="password">密码</label>
                <input id="password" type="password" placeholder="密码" autocomplete="current-password">

                <div id="email-register-fields" class="register-only" hidden>
                    <label for="password-confirm">确认密码</label>
                    <input id="password-confirm" type="password" placeholder="再次输入密码" autocomplete="new-password">
                </div>

                <label class="login-only" style="display:flex;align-items:center;gap:8px;color:var(--text);margin-bottom:14px;">
                    <input type="checkbox" id="remember-password" style="width:auto;margin:0;">
                    记住密码
                </label>

                <button type="button" class="btn btn-primary" id="btn-email-submit">登录</button>
                <p class="msg" id="email-msg"></p>
                <p class="mode-switch">
                    <span id="email-mode-hint">没有账号？</span>
                    <button type="button" id="email-mode-toggle">注册</button>
                </p>
                <datalist id="remembered-emails"></datalist>
            </div>

            <div class="offline-section">
                <h2>离线授权</h2>
                <label for="offline-code">授权码</label>
                <input id="offline-code" type="text" placeholder="AINEWS1-..." autocomplete="off">
                <button type="button" class="btn btn-primary" id="btn-offline-redeem">使用授权码</button>
                <p class="msg" id="offline-msg"></p>
            </div>
        </div>
    </div>

    <div id="startup-loading" class="startup-loading" hidden role="dialog" aria-modal="true" aria-labelledby="startup-title" aria-describedby="startup-status">
        <div id="startup-body" class="startup-loading-inner">
            <div class="ripple-logo-wrap" aria-hidden="true">
                <span class="ripple-ring"></span>
                <span class="ripple-ring"></span>
                <span class="ripple-ring"></span>
                <img class="startup-logo" src="brand/ainews-mark.png?v=20260914" alt="">
            </div>
            <h2 id="startup-title" class="startup-title">AINews</h2>
            <p id="startup-status" class="startup-status" aria-live="polite">正在启动应用…</p>
            <div id="startup-progress" class="startup-progress" hidden aria-hidden="true">
                <div id="startup-progress-bar" class="startup-progress-bar"></div>
            </div>
            <p id="startup-step-label" class="startup-step-label" hidden></p>
            <p id="startup-hint" class="startup-hint">首次启动需下载 AI 组件与浏览器，请保持网络畅通</p>
            <div id="startup-error" class="startup-error" hidden role="alert">
                <h3 id="startup-error-title" class="startup-error-title">启动失败</h3>
                <p id="startup-error-summary" class="startup-error-summary"></p>
                <pre id="startup-error-detail" class="startup-error-detail" tabindex="0" aria-label="技术诊断信息"></pre>
                <div class="startup-error-actions">
                    <button type="button" class="btn btn-secondary" id="btn-startup-copy">复制诊断信息</button>
                    <button type="button" class="btn btn-primary" id="btn-startup-retry">重试</button>
                    <button type="button" class="btn btn-secondary" id="btn-startup-back">返回登录</button>
                </div>
            </div>
        </div>
    </div>

    <div class="captcha-modal" id="captcha-modal" hidden>
        <div class="captcha-box">
            <strong>请完成验证</strong>
            <div class="captcha-svg" id="captcha-svg"></div>
            <input id="captcha-answer" type="text" placeholder="计算结果" autocomplete="off">
            <div style="display:flex;gap:8px;margin-top:12px;">
                <button type="button" class="btn btn-secondary" id="captcha-cancel">取消</button>
                <button type="button" class="btn btn-primary" id="captcha-confirm" style="flex:1;margin-top:0;">确认</button>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
