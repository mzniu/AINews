version: 1
default_template_id: flash_news_portrait
templates:
  - id: flash_news_portrait
    label: 快讯竖屏（默认）
    builtin: true
    layout_kind: classic_overlay
    canvas:
      width: 1080
      height: 1920
      fps: 24
    background_image: static/imgs/bg.png
    typography:
      title_font_size: 72
      subtitle_font_size: 68
      summary_font_size: 44
      main_line1_color: "#FFFFFF"
      main_line2_color: "#FFFFFF"
      title_y_percent: 12
      title_x_percent: 8
      title_width_percent: 84
    video:
      show_summary: true
      summary_scroll_mode: line_uniform
      max_selected_images: 4
      random_bgm: true
      bgm_dir: static/music
      prepend_cover_intro: true
      cover_intro_frames: 1
      clip_durations_by_count:
        1: [7.0]
        2: [3.5, 3.5]
        3: [2.5, 3.0, 3.0]
      clip_sec_when_at_least:
        count: 4
        sec: 2.0
      fallback_clip_sec: 2.5
    cover:
      enabled: true
      width: 1080
      height: 1920
  - id: flash_news_violet
    label: 快讯竖屏（紫夜）
    builtin: true
    layout_kind: classic_overlay
    canvas:
      width: 1080
      height: 1920
      fps: 24
    background_image: static/imgs/templates/flash_news_violet/bg.png
    typography:
      title_font_size: 72
      subtitle_font_size: 68
      summary_font_size: 44
      main_line1_color: "#FFFFFF"
      main_line2_color: "#FFFFFF"
      subtitle_bar_color: "#6B4DFF"
      subtitle_text_color: "#FFFFFF"
      title_y_percent: 12
      title_x_percent: 8
      title_width_percent: 84
    video:
      show_summary: true
      summary_scroll_mode: line_uniform
      max_selected_images: 4
      random_bgm: true
      bgm_dir: static/music
      prepend_cover_intro: true
      cover_intro_frames: 1
      clip_durations_by_count:
        1: [7.0]
        2: [3.5, 3.5]
        3: [2.5, 3.0, 3.0]
      clip_sec_when_at_least:
        count: 4
        sec: 2.0
      fallback_clip_sec: 2.5
    cover:
      enabled: true
      width: 1080
      height: 1920
  - id: chronicle_archive_tech_blue
    label: 档案框（科技蓝）
    builtin: true
    layout_kind: chronicle_frame
    canvas:
      width: 1080
      height: 1920
      fps: 24
    background_image: static/imgs/templates/chronicle_tech_blue/bg.png
    palette:
      bg: "#0A1424"
      bg_glow: "#1B6F9C"
      accent: "#4BE4FF"
      accent_dim: "#1F7FA6"
      text: "#F4F7FA"
      text_muted: "#8B96A8"
      card: "#FFFFFF"
      card_tab: "#070B10"
      frame: "#1A6A8A"
    chrome:
      brand: AI 资讯
      mark_glyph: 牛
      mark_path: static/imgs/templates/chronicle_tech_blue/mark_niu.png
      eyebrow: AI CHRONICLE / ARCHIVE RECORD
      brand_sub: 粉碎AI信息差 / 消除AI焦虑
      footer_left: AI 快讯
      card_keyword_fallback: 快讯
      footer_strip_prefixes:
        - 小牛说：
    typography:
      title_font_size: 64
      subtitle_font_size: 52
      brand_sub_font_size: 28
      footer_font_size: 40
      summary_y_percent: 73.2
      footer_y_percent: 87.0
      summary_font_size: 38
      summary_width_percent: 84
      summary_align: left
      top_pad_percent: 5
      title_highlight_color: "#FFEC30"
      # 主标题底：同色系抬升表面（介于 bg 与 accent_dim 之间），避免荧光色块突兀
      title_bg_color: "#1B4058"
      title_bg_border_color: "#2D708C"
      title_bg_pad_x: 16
      title_bg_pad_y: 9
      title_bg_radius: 4
      main_line1_color: "#F4F7FA"
      main_line2_color: "#F4F7FA"
      subtitle2_color: "#3DDCFF"
      title_y_percent: 12
    layout:
      card_top_percent: 33.2
      card_bottom_percent: 72.8
      card_left_percent: 3.8
      card_right_percent: 96.2
      card_inset_px: 8
      title_rule_x_percent: 4.5
      title_x_pad_px: 18
      title_right_pad_px: 20
    video:
      show_summary: false
      max_selected_images: 4
      random_bgm: true
      bgm_dir: static/music
      prepend_cover_intro: true
      cover_intro_frames: 1
      card_ken_burns: true
      ken_burns_end_scale: 1.22
      summary_animation:
        mode: typewriter
        scope: once
        chars_per_second: 14
        start_delay_sec: 0.35
        show_cursor: true
        cursor_blink_hz: 2
        cursor_hide_after_done_sec: 0.5
      card_motion:
        enabled: true
        random: true
        end_scale: 1.22
        pan_percent: 70
        effects:
          - zoom_in
          - zoom_out
          - pan_left
          - pan_right
          - pan_up
          - pan_down
          - zoom_in_left
          - zoom_in_right
          - zoom_in_up
          - zoom_in_down
      clip_durations_by_count:
        1: [7.0]
        2: [3.5, 3.5]
        3: [2.5, 3.0, 3.0]
      clip_sec_when_at_least:
        count: 4
        sec: 2.0
      fallback_clip_sec: 2.5
    cover:
      enabled: true
      width: 1080
      height: 1920
      crop: none
      card_images: 1
  - id: chronicle_evidence_stack
    label: 证据卡
