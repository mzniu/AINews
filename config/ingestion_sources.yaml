version: 1

defaults:
  schedule_cron: "0 * * * *"
  timezone: Asia/Shanghai
  max_list_pages: 2
  max_new_articles_per_run: 30
  request_delay_sec: 2
  use_playwright: false
  download_images: true
  max_images_per_article: 20
  max_image_bytes: 10485760
  stop_after_existing: 5
  ingest_performance:
    auto_llm_for_sa_on_ingest: false
    story_cluster_llm_on_ingest: false
  story_cluster:
    enabled: true
    title_threshold: 0.72
    hours_window: 72
    gray_low: 0.55
    embedding:
      enabled: true
      method: hashing
      rule_weight: 0.55
      embedding_weight: 0.45
      dimensions: 256
    llm:
      enabled: true
      gray_low: 0.55
      gray_high: 0.85
      min_confidence: 0.7
    review:
      enabled: true
      scan_limit: 30
      merge_candidate_threshold: 0.62

sources:
  - id: aitnt_travel
    slug: aitnt_travel
    display_name: AITNT Travel 资讯
    enabled: true
    adapter: aitnt_news
    base_url: http://travel.aitntnews.com
    list_url: http://travel.aitntnews.com/?index=1
    list_pagination:
      type: query_index
      param: index
      start: 1
    schedule_cron: "0 * * * *"
    requires_playwright: false

  - id: kr36_ai
    slug: kr36_ai
