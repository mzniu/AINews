# S 级或 ≥80 分：异步媒体流水线（配图+文案+出片）
post_score_automation:
  enabled: true
  skip_if_done: true
  include_story_images: true
  voiceover_min_chars: 40
  voiceover_max_chars: 90
  auto_llm:
    enabled: true
    min_grade: A
  media_pipeline:
    enabled: true
    trigger:
      min_grade: S
      min_score: 80
      logic: or
    score_images: true
    generate_content: true
    prepare_video: true
    render_video: true
    max_selected_images: 4
    random_bgm: true
    bgm_dir: static/music
    background_image: static/imgs/bg.png
    clip_duration_sec: 2.5
    render_cover: true
    prepend_cover_intro: true
    cover_intro_duration_sec: 1.0
    cover_width: 1080
    cover_height: 1440
  # 出片成功后自动为所有已登录平台创建发布任务
  auto_publish:
    enabled: true
    skip_if_exists: true
