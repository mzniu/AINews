# S 级或 ≥80 分：异步媒体流水线（配图+文案+出片）
post_score_automation:
  enabled: true
  skip_if_done: true
  include_story_images: true
  voiceover_min_chars: 70
  voiceover_max_chars: 90
  auto_llm:
    enabled: true
    min_grade: A
  media_pipeline:
    enabled: true
    trigger:
      min_grade: S
      min_score: 80
      logic: or
    score_images: true
    generate_content: true
    prepare_video: true
    render_video: true
    max_selected_images: 4
    random_bgm: true
    bgm_dir: static/music
    background_image: static/imgs/bg.png
    clip_duration_sec: 2.5
    render_cover: true
    prepend_cover_intro: true
    auto_remove_watermark: true
  # 出片成功后自动为所有已登录平台创建发布任务
  auto_publish:
    enabled: true
    skip_if_exists: true
    min_grade: S
    interval_minutes: 60
    quiet_hours:
      enabled: false
      start: "23:00"
      end: "07:00"
  # 同一 Story 仅代表篇出片，避免跨源重复选题
  story_gate:
    enabled: true
    require_primary: true
    one_pipeline_per_story: true
